name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Authentication and integration unit tests
        run: python -m unittest discover -s tests -v
      - name: PowerShell offline tests
        shell: pwsh
        run: ./scripts/test_onedrive_image.ps1
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
